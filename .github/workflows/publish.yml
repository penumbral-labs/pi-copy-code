name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate (for example, v0.3.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    name: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit to validate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install npm 11.10.0
        run: npm install --global npm@11.10.0
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          node <<'NODE'
          const expected = `v${require("./package.json").version}`;
          if (process.env.RELEASE_TAG !== expected) {
            console.error(`Release tag ${process.env.RELEASE_TAG} does not match ${expected}`);
            process.exit(1);
          }
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm run smoke-package
      - name: Exercise npm publish without a registry write
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run

  publish:
    name: publish
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: validate-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install npm 11.10.0
        run: npm install --global npm@11.10.0
      - name: Publish package
        run: npm publish --provenance
