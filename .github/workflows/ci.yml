name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-check:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check

  check:
    name: check
    needs: node-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Node checks to pass
        env:
          NODE_CHECK_RESULT: ${{ needs.node-check.result }}
        run: test "$NODE_CHECK_RESULT" = success

  latest-pi:
    name: latest-pi
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install current Pi packages without changing the lockfile
        run:
          npm install --no-save --package-lock=false @earendil-works/pi-coding-agent@latest
          @earendil-works/pi-tui@latest
      - run: npm run check
